services:
  postgres:
    image: postgres:16-alpine
    container_name: eco-fetch-db
    environment:
      POSTGRES_USER: eco
      POSTGRES_PASSWORD: eco
      POSTGRES_DB: eco-fetch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eco -d eco-fetch"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: